{{- define "main" }}
<article class="note-card note-single">
    <header class="note-head">
        <span class="note-avatar" aria-hidden="true">D</span>
        <span class="note-names">
            <span class="note-author">{{ site.Title }}</span>
            <span class="note-handle">@dycoai</span>
        </span>
        <span class="note-time">{{ .Date.Format "Jan 2, 2006 · 15:04" }}</span>
    </header>
    <div class="note-body">
        {{ .Content }}
    </div>
    {{- with .Params.tags }}
    <footer class="note-tags">
        {{- range . }}<a class="note-tag" href="{{ printf "tags/%s/" (urlize .) | absLangURL }}">#{{ . }}</a>{{ end }}
    </footer>
    {{- end }}
</article>
<nav class="pagination notes-pagination">
    <a class="button" href="{{ (.Site.GetPage "/notes").RelPermalink }}">« Back to feed</a>
</nav>
{{- end }}
